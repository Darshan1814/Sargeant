server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large log-file uploads (default nginx cap is 1 MB → 413). Raise to
    # 512 MB so big .log/.evtx-text exports go straight to /api/upload.
    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Large uploads + long batch parsing can take a while; don't time out.
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }
}
